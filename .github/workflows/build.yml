name: Build CSar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-apk
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'src/**', 'stab-plugin/**') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked

      - name: Android env (ghim bản công cụ, in chẩn đoán)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          echo "--- build-tools:"; ls "$SDK/build-tools" || true
          echo "--- ndk:"; ls "$SDK/ndk" || true
          echo "--- NDK mặc định: $ANDROID_NDK_HOME"; cat "$ANDROID_NDK_HOME/source.properties" || true
          echo "--- Cargo.toml:"; grep -m1 '^version' Cargo.toml; grep -m1 '^display_version' Cargo.toml
          # đảm bảo có build-tools 34.0.0 + platform 34, rồi bỏ các bản build-tools khác
          # để cargo-apk không vấp tên thư mục lạ (lỗi "Invalid semver")
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK/build-tools/34.0.0" ] || [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "build-tools;34.0.0" "platforms;android-34"
          fi
          for d in "$SDK"/build-tools/*; do
            [ "$(basename "$d")" = "34.0.0" ] || sudo rm -rf "$d"
          done
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KS_PASS"
          else
            PASS="csan-temp-pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias csan \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CSan"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build
        run: env -u ANDROID_SDK_ROOT cargo apk build --release

      # plugin ổn định (thuần Rust). Lỗi ở đây không làm hỏng bản app chính.
      - name: Build plugin CSar Stab
        continue-on-error: true
        run: env -u ANDROID_SDK_ROOT cargo apk build --release -p csar-stab

      - name: Đặt tên APK theo phiên bản
        id: ver
        run: |
          V=$(grep -m1 '^display_version' Cargo.toml | cut -d'"' -f2)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          ls -la target/release/apk/ || true
          # chọn đúng 1 tệp APK (ưu tiên CSan.apk, nếu không thì tệp lớn nhất)
          APK=target/release/apk/CSar.apk
          if [ ! -f "$APK" ]; then APK=$(ls -S target/release/apk/*.apk | head -n 1); fi
          echo "Dùng: $APK"
          cp "$APK" "dist/CSar-$V.apk"
          if [ -f target/release/apk/CSarStab.apk ]; then cp target/release/apk/CSarStab.apk "dist/CSarStab-$V.apk"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: CSar-${{ steps.ver.outputs.v }}
          path: dist/*.apk

  plugin-opencv:
    # Bản plugin dùng OpenCV (tuỳ chọn). Lỗi ở job này không ảnh hưởng job build chính.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-apk
            target
          key: ${{ runner.os }}-ocv-${{ hashFiles('Cargo.toml', 'src/**', 'stab-plugin/**') }}
          restore-keys: ${{ runner.os }}-ocv-

      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked

      - name: Android env (ghim bản công cụ, in chẩn đoán)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          echo "--- build-tools:"; ls "$SDK/build-tools" || true
          echo "--- ndk:"; ls "$SDK/ndk" || true
          echo "--- NDK mặc định: $ANDROID_NDK_HOME"; cat "$ANDROID_NDK_HOME/source.properties" || true
          echo "--- Cargo.toml:"; grep -m1 '^version' Cargo.toml; grep -m1 '^display_version' Cargo.toml
          # đảm bảo có build-tools 34.0.0 + platform 34, rồi bỏ các bản build-tools khác
          # để cargo-apk không vấp tên thư mục lạ (lỗi "Invalid semver")
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK/build-tools/34.0.0" ] || [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "build-tools;34.0.0" "platforms;android-34"
          fi
          for d in "$SDK"/build-tools/*; do
            [ "$(basename "$d")" = "34.0.0" ] || sudo rm -rf "$d"
          done
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KS_PASS"
          else
            PASS="csan-temp-pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias csan \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CSan"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"


      - name: OpenCV Android SDK
        run: |
          curl -fL -o ocv.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q ocv.zip
          ls OpenCV-android-sdk/sdk/native/libs/ || true

      - name: Thư viện runtime (libopencv_java4 + libc++_shared)
        run: |
          mkdir -p android-libs/arm64-v8a
          cp OpenCV-android-sdk/sdk/native/libs/arm64-v8a/libopencv_java4.so android-libs/arm64-v8a/
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" android-libs/arm64-v8a/
          sed -i 's|^build_targets = \["aarch64-linux-android"\]|&\nruntime_libs = "../android-libs"|' stab-plugin/Cargo.toml
          grep -n runtime_libs stab-plugin/Cargo.toml

      - name: Build plugin CSar Stab (OpenCV)
        env:
          OPENCV_INCLUDE_PATHS: ${{ github.workspace }}/OpenCV-android-sdk/sdk/native/jni/include
          OPENCV_LINK_PATHS: ${{ github.workspace }}/OpenCV-android-sdk/sdk/native/libs/arm64-v8a
          OPENCV_LINK_LIBS: opencv_java4
          OPENCV_DISABLE_PROBES: pkg_config,cmake,vcpkg_cmake,vcpkg
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=aarch64-linux-android29
        run: env -u ANDROID_SDK_ROOT cargo apk build --release -p csar-stab --features opencv

      - name: Đặt tên APK
        id: ver
        run: |
          V=$(grep -m1 '^display_version' Cargo.toml | cut -d'"' -f2)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp target/release/apk/CSarStab.apk "dist/CSarStab-OpenCV-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CSarStab-OpenCV-${{ steps.ver.outputs.v }}
          path: dist/*.apk

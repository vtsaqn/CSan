name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-apk
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'src/**') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked

      - name: Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KS_PASS"
          else
            PASS="csan-temp-pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias csan \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CSan"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build
        run: cargo apk build --release

      - name: Đặt tên APK theo phiên bản
        id: ver
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | sed 's/\.0$//')
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp target/release/apk/*.apk "dist/CSan-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CSan-${{ steps.ver.outputs.v }}
          path: dist/*.apk

[package]
name = "csar-stab"
version = "26.11.27"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Bộ ổn định dùng OpenCV (LK optical flow + estimateAffinePartial2D). Cần OpenCV Android SDK, xem workflow.
opencv = ["dep:opencv"]

[dependencies]
egui = "=0.29.1"
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"
jni = "0.21"
opencv = { version = "0.92", default-features = false, features = ["calib3d", "imgproc", "video"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.android]
package = "zanq.fun.csarstab"
apk_name = "CSarStab"
resources = "../res"
build_targets = ["aarch64-linux-android"]
# Khi build bản OpenCV, workflow thêm dòng runtime_libs = "../android-libs" (libopencv_java4.so, libc++_shared.so)

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
label = "CSar Stab"
icon = "@mipmap/ic_launcher"
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[package]
name = "csan"
version = "26.11.27-1"
edition = "2021"

# Lưu ý: cargo-apk tự suy versionName/versionCode từ "version" (dạng YY.MM.DD, mỗi số <= 255) và
# từ chối version_name/version_code đặt tay. Phiên bản hiển thị theo ngày (DDMM.YY) nằm ở display_version.
[workspace]
members = ["stab-plugin"]

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = "=0.29.1"
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"
jni = "0.21"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.csan]
display_version = "2711.26.1"

[package.metadata.android]
package = "zanq.fun.csar"
apk_name = "CSar"
resources = "res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
label = "CSar"
icon = "@mipmap/ic_launcher"
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"
[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"
[[package.metadata.android.uses_permission]]
name = "android.permission.HIGH_SAMPLING_RATE_SENSORS"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false
